name: Actualizar CV Makro

on:
  push:
    paths:
      - '.github/workflows/update-cv-makro.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-crosextra-carlito
          python -m pip install --quiet pymupdf

      - name: Actualizar PDF ES y EN
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path

          regular = "/usr/share/fonts/truetype/crosextra/Carlito-Regular.ttf"
          bold = "/usr/share/fonts/truetype/crosextra/Carlito-Bold.ttf"

          jobs = [
              (Path("files/CV-Andrea-Miggiano.pdf"), "Delegado Comercial"),
              (Path("files/CV-Andrea-Miggiano-EN.pdf"), "Sales Representative"),
          ]

          for path, role in jobs:
              doc = fitz.open(path)
              page = doc[0]

              block = fitz.Rect(216.5, 66.0, 360.0, 112.0)
              page.add_redact_annot(block, fill=(1, 1, 1))
              page.apply_redactions()

              page.insert_font(fontname="CarlitoB", fontfile=bold)
              page.insert_font(fontname="CarlitoR", fontfile=regular)

              dark = (25/255, 25/255, 25/255)
              grey = (85/255, 85/255, 85/255)

              page.insert_text((217.8, 79.95), "Makro Paper - Campus",
                               fontname="CarlitoB", fontsize=12, color=dark)
              page.insert_text((217.8, 93.85), "05/2025 - 09/2026",
                               fontname="CarlitoR", fontsize=12, color=grey)
              page.insert_text((217.8, 107.75), role,
                               fontname="CarlitoB", fontsize=12, color=dark)

              tmp = path.with_suffix(".tmp.pdf")
              doc.save(tmp, deflate=True)
              doc.close()
              tmp.replace(path)
          PY

      - name: Validar contenido
        run: |
          python - <<'PY'
          import fitz
          for p in ["files/CV-Andrea-Miggiano.pdf", "files/CV-Andrea-Miggiano-EN.pdf"]:
              text = fitz.open(p)[0].get_text()
              assert "Makro Paper - Campus" in text, p
              assert "05/2025 - 09/2026" in text, p
              assert "614 529 846" in text, p
          PY

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/CV-Andrea-Miggiano.pdf files/CV-Andrea-Miggiano-EN.pdf
          git commit -m "Actualizar CV: Makro Paper - Campus y fecha"
          git push
